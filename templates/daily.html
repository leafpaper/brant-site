<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface2:#ecebe5; --text:#1f1f22; --muted:#66655f; --faint:#8f8e88; --border:#e2e0d8;
  --accent:#a24a22; --accent-bg:#f7ece5; --quote:#8a3d1a;
  --chip:#efeee8; --rid:#2a5786; --rid-bg:#e6edf6;
  --warn:#a3322b; --warn-bg:#f9e8e6; --ok:#2b6c45; --ok-bg:#e2f0e7; --pend:#865700; --pend-bg:#f8eed6;
  --blue:#2a5786; --blue-bg:#e6edf6; --grey:#66655f; --grey-bg:#ecebe5;
  --mark:#ffe17a; --shadow:0 1px 2px rgba(30,25,10,.05),0 3px 12px rgba(30,25,10,.05); --popshadow:0 10px 34px rgba(0,0,0,.16);
  --hh:57px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --surface:#1d1d20; --surface2:#26262a; --text:#e9e7e2; --muted:#a5a39d; --faint:#7d7b75; --border:#303035;
    --accent:#e39a72; --accent-bg:#33251e; --quote:#efb491;
    --chip:#28282d; --rid:#a0c4ea; --rid-bg:#212d3b;
    --warn:#f09a92; --warn-bg:#3a2321; --ok:#8fd2a7; --ok-bg:#1d3226; --pend:#efc56f; --pend-bg:#362c16;
    --blue:#a0c4ea; --blue-bg:#212d3b; --grey:#a5a39d; --grey-bg:#28282d;
    --mark:#6a5814; --shadow:none; --popshadow:0 10px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1d1d20; --surface2:#26262a; --text:#e9e7e2; --muted:#a5a39d; --faint:#7d7b75; --border:#303035;
  --accent:#e39a72; --accent-bg:#33251e; --quote:#efb491;
  --chip:#28282d; --rid:#a0c4ea; --rid-bg:#212d3b;
  --warn:#f09a92; --warn-bg:#3a2321; --ok:#8fd2a7; --ok-bg:#1d3226; --pend:#efc56f; --pend-bg:#362c16;
  --blue:#a0c4ea; --blue-bg:#212d3b; --grey:#a5a39d; --grey-bg:#28282d;
  --mark:#6a5814; --shadow:none; --popshadow:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}

/* 顶栏 */
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border)}
.topin{max-width:1260px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.brand small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.tabs{display:flex;gap:4px}
.tab{padding:4px 12px;border-radius:999px;text-decoration:none;font-size:14px;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--surface2)}
.tab.on{background:var(--text);color:var(--bg)}
.tab .cnt{font-size:11.5px;margin-left:5px;opacity:.75}
.search{flex:1;min-width:170px;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;padding:6px 12px 6px 32px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:14px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.tools{display:flex;gap:6px}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:10px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text)}
.iconbtn[aria-pressed="true"]{color:var(--text);background:var(--chip)}

/* 布局 */
.wrap{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);gap:36px;padding:0 16px}
aside#days{position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow:auto;padding:16px 6px 40px 0;scrollbar-width:thin}
.sidehead{font-size:12px;color:var(--faint);padding:0 12px 8px}
.day{display:block;text-decoration:none;padding:8px 12px;border-radius:10px;margin-bottom:3px;border:1px solid transparent}
.day:hover{background:var(--surface2)}
.day.on{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow)}
.day .dd{font-weight:650;font-size:14px;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.day .dd span{color:var(--muted);font-weight:400;font-size:13px}
.day .old{font-style:normal;font-size:11px;color:var(--faint);background:var(--chip);border-radius:4px;padding:0 5px;margin-left:auto}
.day .hl{font-size:12.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
main{min-width:0;padding:6px 0 90px}
article{max-width:790px}

/* 一场的头部 */
.dayhead{padding:22px 0 4px}
.dayhead h1{font-size:28px;line-height:1.3;margin:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dayhead h1 .wd{font-size:15px;color:var(--muted);font-weight:500}
.meta{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.meta strong{color:var(--text);font-weight:600}
.disc{font-size:12.5px;color:var(--faint);margin:6px 0 0;line-height:1.6}
.secnav{position:sticky;top:var(--hh);z-index:20;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin-top:12px;border-bottom:1px solid var(--border);scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:0 0 auto;text-decoration:none;font-size:13px;line-height:1.6;padding:2px 11px;border-radius:999px;color:var(--muted);border:1px solid var(--border);background:var(--surface)}
.secnav a.on{color:#fff;background:var(--accent);border-color:var(--accent)}
:root[data-theme="dark"] .secnav a.on{color:#1a1a1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .secnav a.on{color:#1a1a1a}}

/* 节 */
.sec{scroll-margin-top:calc(var(--hh) + 60px);margin-top:36px}
.sec>h2{font-size:19px;line-height:1.4;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.sec>h2 .sn{font-size:13px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums;min-width:1.2em}
.sec p{margin:8px 0}
.sec ul{margin:6px 0;padding-left:1.15em}
.sec li{margin:7px 0}
.sec li::marker{color:var(--faint)}
.sec li.lvl1{margin-left:1.2em}.sec li.lvl2{margin-left:2.4em}
.sec h3{font-size:16px;margin:20px 0 6px}
.sec h4{font-size:15.5px;margin:20px 0 6px;font-weight:650}
.k-direction h4{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:9px 14px;border-radius:8px;line-height:1.6}
.k-trades h4,.k-presets h4{font-size:14px;color:var(--muted);text-transform:none;letter-spacing:.04em}

/* 行内元素 */
.q{color:var(--quote)}
.ts{font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint);border-radius:4px;padding:0 2px;margin:0 1px;white-space:nowrap;vertical-align:1px;cursor:help;opacity:.85}
.eid{font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint);white-space:nowrap;margin:0 2px;cursor:help}
.rid{font:600 11.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--rid);background:var(--rid-bg);border:0;border-radius:4px;padding:1px 5px;margin:0 1px;cursor:pointer;vertical-align:1px}
.rid:hover{text-decoration:underline}
.pid{font:600 11.5px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--pend);background:var(--pend-bg);border-radius:4px;padding:1px 5px;text-decoration:none;white-space:nowrap;vertical-align:1px}
.tag{font-size:11.5px;color:var(--muted);background:var(--chip);border-radius:4px;padding:1px 6px;margin:0 2px;white-space:nowrap;font-weight:400}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.src{font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint);background:var(--chip);border-radius:4px;padding:1px 5px;margin:0 2px;white-space:nowrap;vertical-align:1px;cursor:help}
body.nots .ts,body.nots .tsg,body.nots .eid,body.nots .times,body.nots .src{display:none}
.ecard{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:14px 0;color:inherit;text-decoration:none}
.ecard:hover{border-color:var(--faint)}
.ecard h2{font-size:18px;line-height:1.5;margin:0}
.ecard .em{font-size:12.5px;color:var(--muted);margin-top:6px}
.ecard p{margin:10px 0 0;font-size:14.5px;line-height:1.8}
.essay .sec p,.essay .sec li{font-size:15.5px;line-height:1.9}
.essay .dayhead h1{font-size:25px}

/* 速览 */
.brief{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:4px 20px;box-shadow:var(--shadow)}
.brief .row{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--border)}
.brief .row:first-child{border-top:0}
.brief .row.one{grid-template-columns:1fr}
.brief .lbl{font-size:13px;font-weight:650;color:var(--accent);padding-top:2px;line-height:1.6}
.brief .row:first-child .val{font-size:16.5px;font-weight:500}

/* 心法 */
.ltools{display:flex;justify-content:flex-end;margin:-4px 0 8px}
.lesson{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:8px 0;scroll-margin-top:calc(var(--hh) + 60px)}
.lesson summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lesson summary::-webkit-details-marker{display:none}
.lesson summary::after{content:"";flex:0 0 auto;width:7px;height:7px;margin-left:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.lesson[open] summary::after{transform:translateY(0) rotate(-135deg)}
.lesson .num{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint);flex:0 0 auto}
.lesson .lt{font-weight:650;font-size:15.5px;line-height:1.55;flex:1 1 16em}
.badges{display:flex;gap:4px;flex:0 0 auto;margin-left:auto}
.scope{font-size:11.5px;line-height:1.7;padding:0 8px;border-radius:999px;white-space:nowrap}
.s-gen{color:var(--ok);background:var(--ok-bg)}
.s-self{color:var(--blue);background:var(--blue-bg)}
.s-aud{color:var(--pend);background:var(--pend-bg)}
.s-contra{color:var(--warn);background:var(--warn-bg)}
.lbody{padding:2px 16px 12px;border-top:1px solid var(--border)}
.lbody ul{padding-left:1.15em}
.keyq{margin:12px 0;padding:9px 14px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 8px 8px 0;color:var(--quote)}
.keyq .q{color:inherit}
.refs{font-size:13px;color:var(--muted);line-height:1.7}
.refs.contra{color:var(--warn)}
.times{font-size:12px;color:var(--faint);margin:4px 0 0}

/* 个股、人物卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;margin:8px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:14.5px;line-height:1.7}
.card .name{font-weight:700;font-size:15px;margin-bottom:2px}
.card.wide{grid-column:1/-1}

/* 时间线 */
.tl{margin:6px 0}
.ti{display:grid;grid-template-columns:5.8em minmax(0,1fr);gap:16px;scroll-margin-top:calc(var(--hh) + 60px)}
.ti .when{text-align:right;padding:11px 0;font-variant-numeric:tabular-nums}
.ti .et{font-weight:700;font-size:15.5px;line-height:1.3}
.ti .et small{font-size:11px;color:var(--faint);font-weight:400;margin-right:3px}
.ti .et2{font-size:12.5px;font-weight:650;line-height:1.45}
.ti .bj,.ti .pg{font-size:11.5px;color:var(--faint);line-height:1.45}
.ti .what{position:relative;padding:10px 0 10px 18px;border-left:2px solid var(--border);font-size:15px}
.ti .what::before{content:"";position:absolute;left:-6px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}

/* 翻页、页脚 */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:52px;padding-top:18px;border-top:1px solid var(--border)}
.pager a{text-decoration:none;font-size:14px;color:var(--muted);padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.pager a:hover{color:var(--text)}
.foot{font-size:12px;color:var(--faint);margin-top:28px}

/* 预设看板 */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:16px 0 6px}
.fchip{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.fchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.filters select{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13px;margin-left:auto}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin:10px 0;scroll-margin-top:calc(var(--hh) + 20px)}
.pgroup{margin:24px 0 4px}
.pgh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 2px 6px;border-bottom:1px solid var(--border)}
.pgh .tk{font-size:17px}
.pgc{font-size:12.5px;color:var(--muted)}
.pgroup .pcard{margin:8px 0}
.tk2{font-weight:700;font-size:13px;color:var(--muted)}
.pcard.flash{animation:flash 2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.ptop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ptop .pidl{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint)}
.tk{font-weight:700;font-size:15.5px}
.kind{color:var(--muted);background:var(--chip);border-radius:4px;padding:0 7px;font-size:12px;line-height:1.8}
.st{border-radius:999px;padding:0 9px;font-size:12px;line-height:1.8;white-space:nowrap}
.st-pend{color:var(--pend);background:var(--pend-bg)}.st-ok{color:var(--ok);background:var(--ok-bg)}
.st-grey{color:var(--grey);background:var(--grey-bg)}.st-blue{color:var(--blue);background:var(--blue-bg)}
.st-void{color:var(--faint);background:var(--grey-bg);text-decoration:line-through}
.pfrom{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.prow{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:10px;margin-top:7px;font-size:14.5px;line-height:1.7}
.prow .lbl{color:var(--faint);font-size:12.5px;padding-top:2px}
.pq{margin:10px 0 0;padding:7px 12px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 8px 8px 0;color:var(--quote);font-size:14px}
.hist{list-style:none;margin:10px 0 0;padding:8px 0 0;border-top:1px dashed var(--border);font-size:13px;color:var(--muted)}
.hist li{margin:5px 0;line-height:1.65}
.hist .hd{font-variant-numeric:tabular-nums;margin-right:6px}
.empty{color:var(--muted)}

/* 搜索 */
.hitday{margin:22px 0 6px;font-weight:650;font-size:15px}
.hitday span{color:var(--faint);font-weight:400;font-size:13px;margin-left:6px}
.hit{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 13px;margin:6px 0;font-size:14px;line-height:1.7}
.hit:hover{border-color:var(--faint)}
.hit .where{font-size:12px;color:var(--faint);display:block}

/* 理念编号弹层 */
.pop{position:fixed;z-index:60;width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--popshadow);padding:12px 14px;font-size:13.5px;line-height:1.7;display:none}
.pop.show{display:block}
.pop .ph{font-weight:650;margin-bottom:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.pop .pf{font-size:12px;color:var(--faint);margin:6px 0 0}
.pop p{margin:4px 0}

@media (max-width:880px){
  .topin{gap:8px 10px}
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  aside#days{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--border);scrollbar-width:none}
  aside#days::-webkit-scrollbar{display:none}
  .sidehead{display:none}
  .day{flex:0 0 auto;padding:4px 11px;margin:0;border-color:var(--border);background:var(--surface)}
  .day.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .day.on .dd span{color:inherit;opacity:.75}
  .day .hl,.day .old{display:none}
  .search{order:5;max-width:none;flex:1 1 170px;margin-left:0}
  .tools{order:6}
}
@media (max-width:560px){
  body{font-size:15.5px}
  .brand small{display:none}
  .dayhead h1{font-size:24px}
  .brief{padding:2px 14px}
  .brief .row{grid-template-columns:1fr;gap:2px;padding:10px 0}
  .ti{grid-template-columns:4.6em minmax(0,1fr);gap:10px}
  .ti .what{padding-left:14px}
  .lesson summary{padding:10px 12px}.lbody{padding:2px 12px 10px}
  .prow{grid-template-columns:1fr;gap:0}
  .filters select{margin-left:0}
}

/* ===== 大方向时间线(发散色:看空蓝 ← 震荡灰 → 看多红;每格都写字,不只靠颜色) ===== */
:root{--d-ss:#256abf;--d-s:#86b6ef;--d-z:#e4e2dc;--d-l:#ee9190;--d-ll:#b93534;--d-ss-i:#fff;--d-s-i:#14263d;--d-z-i:#4a4944;--d-l-i:#4a1716;--d-ll-i:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--d-ss:#5598e7;--d-s:#1c5cab;--d-z:#3a3a3d;--d-l:#a52f2e;--d-ll:#e66767;--d-ss-i:#0f1726;--d-s-i:#e6eefb;--d-z-i:#d6d4ce;--d-l-i:#fbe9e9;--d-ll-i:#2a0d0d}}
:root[data-theme="dark"]{--d-ss:#5598e7;--d-s:#1c5cab;--d-z:#3a3a3d;--d-l:#a52f2e;--d-ll:#e66767;--d-ss-i:#0f1726;--d-s-i:#e6eefb;--d-z-i:#d6d4ce;--d-l-i:#fbe9e9;--d-ll-i:#2a0d0d}
.dirbox{margin:16px 0 4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.dirtop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13.5px}
.dleg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:auto}
.dleg span{display:inline-flex;align-items:center;gap:4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.dirscroll{overflow-x:auto;margin:10px -4px 0;padding:2px 4px 4px}
table.dir{border-collapse:separate;border-spacing:2px;font-size:11.5px}
table.dir th{font-weight:500;color:var(--muted);white-space:nowrap;padding:0 3px}
table.dir thead th{font-variant-numeric:tabular-nums;font-size:11px}
table.dir thead th a{color:inherit;text-decoration:none}
table.dir thead th.cur a{color:var(--text);font-weight:700}
table.dir tbody th{text-align:right;padding-right:8px;font-size:12px;position:sticky;left:0;background:var(--surface);z-index:1}
table.dir thead th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
table.dir td{padding:0;min-width:34px;height:24px;border-radius:4px;text-align:center}
table.dir td a{display:block;line-height:24px;text-decoration:none;color:inherit;font-weight:600}
table.dir td.cur{outline:2px solid var(--text);outline-offset:0}
.c-ss{background:var(--d-ss);color:var(--d-ss-i)}.c-s{background:var(--d-s);color:var(--d-s-i)}.c-z{background:var(--d-z);color:var(--d-z-i)}
.c-l{background:var(--d-l);color:var(--d-l-i)}.c-ll{background:var(--d-ll);color:var(--d-ll-i)}
.c-n{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--border)}
.dtoday{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;font-size:13px;line-height:1.6}
.dtoday b{color:var(--muted);font-weight:600;margin-right:4px}
.dtoday i{font-style:normal;color:var(--muted);margin-left:6px}
.dnote{font-size:11.5px;color:var(--faint);margin:6px 0 0}
/* ===== 心法:目录 + 卡片(原话 → 要点 → 对应理念) ===== */
.ltop{display:flex;gap:12px;align-items:flex-start;margin:6px 0 14px}
.ltoc{flex:1;margin:0;padding:10px 14px;list-style:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;columns:2 300px;column-gap:28px}
.ltoc li{break-inside:avoid;margin:3px 0;font-size:13.5px;line-height:1.55}
.ltoc a{color:var(--text);text-decoration:none;display:flex;gap:7px;align-items:baseline}
.ltoc a:hover{color:var(--accent)}
.ltoc .tn{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;min-width:2.3em}
.dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center;background:var(--faint)}
.d-gen{background:var(--ok)}.d-self{background:var(--blue)}.d-aud{background:var(--pend)}.d-contra{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--warn)}
.lcards{display:flex;flex-direction:column;gap:12px}
.lcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--faint);border-radius:12px;padding:14px 18px 12px;scroll-margin-top:calc(var(--hh) + 64px)}
.l-gen{border-left-color:var(--ok)}.l-self{border-left-color:var(--blue)}.l-aud{border-left-color:var(--pend)}
.lcard header{display:flex;gap:10px;align-items:baseline}
.lcard header .num{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint)}
.lcard h3{margin:0;font-size:16.5px;line-height:1.5;flex:1}
.lcard .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.lsub{margin:3px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.sep{margin:0 8px;color:var(--faint)}
.lb .keyq{margin:12px 0 6px;font-size:15px;line-height:1.75}
.pts{margin:8px 0 0;padding-left:1.25em}
.pts li{margin:5px 0;line-height:1.75;font-size:15px}
.pts li::marker{color:var(--faint)}
.lrules{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.lrules .lbl,.lnote .lbl{font-size:12px;color:var(--faint);margin-right:6px}
.rchip{display:inline-flex;gap:5px;align-items:baseline;font-size:12px;background:var(--rid-bg);color:var(--rid);border-radius:6px;padding:1px 8px;cursor:pointer;line-height:1.6}
.rchip b{font:600 11.5px ui-monospace,SFMono-Regular,Consolas,monospace}
.lnote{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.lcards.titles .lb,.lcards.titles .lsub{display:none}
.lcards.titles{gap:6px}
/* ===== 个股 / 对人 / 操作 / 账户:名称 | 内容 ===== */
.ents{display:flex;flex-direction:column;gap:10px}
.egroup{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.erow{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:14px;padding:9px 16px;border-top:1px solid var(--border);font-size:15px;line-height:1.7}
.egroup .erow:first-child{border-top:0}
.erow.wide{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.en{font-weight:650}
.stc{display:inline-block;font-size:11.5px;font-weight:650;border-radius:4px;padding:0 6px;margin-right:7px;line-height:1.75;vertical-align:1px}
.tlink{color:inherit;text-decoration:none;border-bottom:1px dashed var(--faint)}
.tlink:hover{color:var(--accent);border-bottom-color:var(--accent)}
.egrp{font-size:13px;color:var(--muted);margin:8px 0 -2px;font-weight:650}
.muted{opacity:.75}
/* ===== 变化:之前 → 今天 ===== */
.chgs{display:flex;flex-direction:column;gap:10px}
.chg{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.ch-h{display:flex;gap:8px;align-items:baseline;font-size:15px;margin-bottom:8px}
.ctag{font-size:11.5px;color:var(--blue);background:var(--blue-bg);border-radius:999px;padding:0 8px;line-height:1.8;white-space:nowrap}
.ch-b{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.ch-x{background:var(--surface2);border-radius:8px;padding:8px 12px;font-size:14.5px;line-height:1.7}
.ch-x.now{background:var(--accent-bg)}
.ch-x .lbl{display:block;font-size:11.5px;color:var(--faint);margin-bottom:2px}
.ch-ar{align-self:center;color:var(--faint);font-size:18px}
.ch-one{font-size:14.5px;line-height:1.7;color:var(--muted)}
.chg.plain{font-size:14.5px;line-height:1.7}
/* ===== 老毛病 ===== */
.hint{font-size:12.5px;color:var(--faint);margin:0 0 8px}
.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mis{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--faint);border-radius:12px;padding:11px 14px}
.mis.like{border-top-color:var(--pend)}.mis.unlike{border-top-color:var(--ok)}
.mh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.mk{font-size:11.5px;font-weight:650;border-radius:999px;padding:0 8px;line-height:1.8;background:var(--grey-bg);color:var(--grey)}
.like .mk{background:var(--pend-bg);color:var(--pend)}.unlike .mk{background:var(--ok-bg);color:var(--ok)}
.mx{font-size:12px;color:var(--muted)}
.mt{font-size:14.5px;line-height:1.7}
/* ===== 本场预设 ===== */
.dps h4{font-size:13.5px;color:var(--muted);margin:12px 0 6px;font-weight:650}
.dps h4 small{font-weight:400;color:var(--faint);margin-left:8px;font-size:12px}
.prw .pend{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
.pid2{display:block;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint);text-decoration:none}
.pid2:hover{color:var(--accent)}
.mraw{display:inline-block;margin-left:10px}
.mraw summary{cursor:pointer;color:var(--faint);font-size:12px}
.mraw[open]{display:block;margin:6px 0 0;font-size:12.5px;line-height:1.7}
.prw{display:grid;grid-template-columns:7em 5.5em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin:6px 0;color:inherit;text-decoration:none;font-size:14.5px;line-height:1.65}
.prw:hover{border-color:var(--faint)}
.ptk{font-weight:700;overflow-wrap:anywhere}
.pk{font-size:12px;color:var(--muted)}
.arr{color:var(--faint);font-weight:400;margin:0 2px}
.dpx{margin-top:10px;font-size:13.5px;color:var(--muted)}
details.raw,details.notes{margin-top:10px}
details.raw summary,details.notes summary{cursor:pointer;color:var(--faint);font-size:12.5px}
.sec>h2 small{font-size:12px;color:var(--faint);font-weight:400;margin-left:8px}
/* ===== 个股档案 ===== */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:16px}
.ttile{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none}
.ttile:hover{border-color:var(--faint)}
.ttile .tn{font-weight:700;font-size:15px}
.ttile .tm{font-size:12px;color:var(--muted);margin:3px 0 8px}
.ttile .tm b{color:var(--pend);font-weight:600}
.dots{display:flex;gap:3px;flex-wrap:nowrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border)}
.dots i.on{background:var(--accent);box-shadow:none}
.dots.big{gap:5px;margin:12px 0 2px}.dots.big i{width:11px;height:11px}
.th2{font-size:15px;margin:24px 0 6px}
.tfew{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.tfew a{color:var(--muted)}
.tday{display:grid;grid-template-columns:5em minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.tdh{font-weight:700;color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums}
.tdh span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tit{display:flex;gap:8px;align-items:baseline;margin:0 0 8px;font-size:14.5px;line-height:1.7}
.tit .tx{flex:1;min-width:0}
.tkind{font-size:11.5px;border-radius:4px;padding:0 6px;background:var(--chip);color:var(--muted);white-space:nowrap}
.k-trades .tkind{background:var(--accent-bg);color:var(--accent)}.k-changes .tkind{background:var(--blue-bg);color:var(--blue)}
.tgo{font-size:12px;color:var(--faint);white-space:nowrap}
@media (max-width:560px){
  .erow{grid-template-columns:1fr;gap:2px}
  .ch-b{grid-template-columns:1fr}.ch-ar{justify-self:center;transform:rotate(90deg)}
  .prw{grid-template-columns:auto 1fr auto}.prw .pc{grid-column:1/-1}
  .ltop{flex-direction:column}.ltop .ltools{align-self:flex-end}
  .lcard{padding:12px 14px}
  .tday{grid-template-columns:1fr;gap:4px}
  .tit{flex-wrap:wrap}
}

<body>
<header class="top">
  <div class="topin">
    <a class="brand" href="#/">__TITLE__<small id="brandsub"></small></a>
    <nav class="tabs" aria-label="视图">
      <a class="tab" id="tab-days" href="#/">每日总结</a>
      <a class="tab" id="tab-tickers" href="#/t">个股<span class="cnt" id="tkcnt"></span></a>
      <a class="tab" id="tab-essays" href="#/essays">心路历程<span class="cnt" id="esscnt"></span></a>
      <a class="tab" id="tab-presets" href="#/presets">预设看板<span class="cnt" id="opencnt"></span></a>
    </nav>
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜总结和文章:英伟达、止盈、恒大…" autocomplete="off" aria-label="搜索全部总结和文章"></label>
    <div class="tools">
      <button type="button" class="iconbtn" id="btn-ts" title="显示或隐藏直播进度时间和事件号" aria-pressed="true">进度时间</button>
      <button type="button" class="iconbtn" id="btn-theme" title="切换主题:跟随系统 / 浅色 / 深色">◐ 自动</button>
    </div>
  </div>
</header>
<div class="wrap">
  <aside id="days" aria-label="场次"></aside>
  <main id="view"></main>
</div>
<div class="pop" id="pop" role="dialog" aria-live="polite"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const DAYS = D.days.slice().sort((a, b) => b.date.localeCompare(a.date));
const RULES = D.rules || {}, PRESETS = D.presets || [];
const BYDATE = new Map(DAYS.map(d => [d.date, d]));
const ESSAYS = D.essays || [], BYSLUG = new Map(ESSAYS.map(e => [e.slug, e]));
const TICKERS = D.tickers || [], TBY = new Map(TICKERS.map(t => [t.key, t]));
const ASC = DAYS.slice().reverse();  // 从早到晚,时间线和圆点条用
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const store = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
const view = $('#view'), side = $('#days'), pop = $('#pop');
const md = d => { const [, m, dd] = d.split('-'); return `${+m}/${+dd}`; };

let bid = 0;
for (const d of DAYS.concat(ESSAYS)) for (const s of d.sections) {
  s.blocks.forEach(b => b.id = 'b' + (bid++));
  s.subs.forEach(u => { u.id = 'b' + (bid++); u.blocks.forEach(b => b.id = 'b' + (bid++)); });
}

/* ---------- 行内格式:粗体、原话、进度时间、事件号、预设号、理念编号 ---------- */
const TS1 = String.raw`(?:\d{2}-\d{2} )?\d{1,2}:\d{2}:\d{2}(?:[–~-]\d{1,2}:\d{2}:\d{2})?`;
const RX = new RegExp([
  String.raw`\*\*(.+?)\*\*`,
  String.raw`「([^「」]*)」`,
  String.raw`[((]((?:\s*(?:${TS1}|E\d{5})\s*[;;,,、]?)+)[))]`,
  `(${TS1})`,
  String.raw`(S\d{8}-\d{2})`,
  String.raw`(?<![A-Za-z0-9])(E\d{5})(?!\d)`,
  String.raw`〔([^〕]{1,16})〕`,
  String.raw`(?<![A-Za-z0-9])([A-Z]{1,2}\d{1,3})(?!\d)`,
  String.raw`\[\[([^\]]{4,80})\]\]`,
].join('|'), 'g');
// 出处 [[20250509_7ZMWXJgEf9Q#26]](场次#卡号)或 [[20240924_mtaD4yBJRZI 00:27:41]](场次 + 直播进度)
function srcSpan(s) {
  const m = s.match(/^(\d{4})(\d{2})(\d{2})_[^#\s]+(?:#(\d+)| (\d{1,2}:\d{2}:\d{2}))?$/);
  const txt = m ? `${m[1]}-${m[2]}-${m[3]}${m[4] ? ' #' + m[4] : m[5] ? ' ' + m[5] : ''}` : s;
  return `<span class="src" title="出处 ${esc(s)}(${m && m[5] ? '直播场次 + 直播进度' : '直播场次#卡号'})">${esc(txt)}</span>`;
}
let CUR = null;
const clock = x => { x = ((x % 1440) + 1440) % 1440; return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
function tsTitle(t) {
  if (!CUR || !CUR.start || /^\d{2}-\d{2} /.test(t)) return '直播进度(开播后多久)';
  const m = t.match(/(\d{1,2}):(\d{2}):(\d{2})/), x = CUR.start.et + (+m[1]) * 60 + (+m[2]);
  return `直播进度 ${m[0]},约美东 ${clock(x)} / 北京 ${clock(x + CUR.start.off * 60)}`;
}
const tsSpan = t => `<span class="ts" title="${esc(tsTitle(t))}">${esc(t)}</span>`;
const eidSpan = e => `<span class="eid" title="事件号,可用 why.py --event ${e} 查">${e}</span>`;
const ridSpan = id => RULES[id] ? `<button type="button" class="rid" data-rid="${id}" title="${esc(RULES[id].n || '')}">${id}</button>` : esc(id);
function inl(s) {
  s = String(s ?? '');
  let out = '', last = 0;
  for (const m of s.matchAll(RX)) {
    out += esc(s.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[1] !== undefined) out += `<strong>${inl(m[1])}</strong>`;
    else if (m[2] !== undefined) out += `<span class="q">「${esc(m[2])}」</span>`;
    else if (m[3] !== undefined) out += '<span class="tsg">' + m[3].split(/[;;,,、]/).map(x => x.trim()).filter(Boolean)
      .map(x => /^E\d{5}$/.test(x) ? eidSpan(x) : tsSpan(x)).join('') + '</span>';
    else if (m[4] !== undefined) out += tsSpan(m[4]);
    else if (m[5] !== undefined) out += `<a class="pid" href="#/presets/${m[5]}" title="去预设看板">${m[5]}</a>`;
    else if (m[6] !== undefined) out += eidSpan(m[6]);
    else if (m[7] !== undefined) out += `<span class="tag">${esc(m[7])}</span>`;
    else if (m[8] !== undefined) out += ridSpan(m[8]);
    else if (m[9] !== undefined) out += srcSpan(m[9]);
  }
  return out + esc(s.slice(last));
}

/* ---------- 各节的版式 ---------- */
const LABEL = /^\*\*([^*]+)\*\*[::]\s*([\s\S]*)$/;
function blk(b) {
  const id = b.id ? ` id="${b.id}"` : '';
  if (b.t === 'li') return `<li class="lvl${Math.min(b.lvl, 2)}"${id}>${inl(b.md)}</li>`;
  const m = b.md.match(/^\*\*([^*]+)\*\*[::]?$/);
  return m ? `<h4${id}>${inl(m[1])}</h4>` : `<p${id}>${inl(b.md)}</p>`;
}
function blocks(list) {
  let h = '', ul = false;
  for (const b of list) {
    if (b.t === 'li' && !ul) { h += '<ul>'; ul = true; }
    if (b.t !== 'li' && ul) { h += '</ul>'; ul = false; }
    h += blk(b);
  }
  return h + (ul ? '</ul>' : '');
}
const subsHtml = s => s.subs.map(u => `<h3 id="${u.id}">${inl(u.title)}</h3>` + blocks(u.blocks)).join('');
const generic = s => blocks(s.blocks) + subsHtml(s);

function rBrief(s) {
  const rows = s.blocks.map(b => {
    const m = b.md.match(LABEL);
    return m ? `<div class="row" id="${b.id}"><div class="lbl">${esc(m[1])}</div><div class="val">${inl(m[2])}</div></div>`
             : `<div class="row one" id="${b.id}"><div class="val">${inl(b.md)}</div></div>`;
  }).join('');
  return `<div class="brief">${rows}</div>` + subsHtml(s);
}

const SCOPE = [[/^通用/, 'gen', '通用经验'], [/^(他本人|他自己)/, 'self', '他自己的做法'], [/^给听众/, 'aud', '给听众的']];
function rLessons(s) {
  if (!s.subs.length) return generic(s);
  let h = blocks(s.blocks) + `<div class="ltools"><button type="button" class="iconbtn" data-act="lessons">全部展开</button></div>`;
  for (const u of s.subs) {
    const m = u.title.match(/^(\d+(?:\.\d+)?)\s*(.*?)\s*([((][^()()]*\d{1,2}:\d{2}:\d{2}[^()()]*[))])?\s*$/);
    const num = m ? m[1] : '', title = m ? m[2] : u.title, times = m && m[3] ? m[3] : '';
    const body = [], foot = [];
    let quote = '', scope = null, contra = false;
    for (const b of u.blocks) {
      const sc = b.t === 'p' && SCOPE.find(x => x[0].test(b.md));
      if (b.t === 'li' && /^「/.test(b.md)) quote += `<blockquote class="keyq" id="${b.id}">${inl(b.md)}</blockquote>`;
      else if (sc) {
        scope = scope || sc;
        const c = /相反/.test(b.md); contra = contra || c;
        foot.push(`<p class="refs${c ? ' contra' : ''}" id="${b.id}">${inl(b.md)}</p>`);
      } else body.push(b);
    }
    if (!scope) {
      const all = u.blocks.map(b => b.md).join(' ');
      const mm = all.match(/[。;]\s*(通用|他本人|他自己|给听众)/);
      if (mm) scope = SCOPE.find(x => x[0].test(mm[1]));
      contra = contra || /与 ?[A-Z]{1,2}\d{1,3} ?相反/.test(all);
    }
    const badges = (scope ? `<span class="scope s-${scope[1]}">${scope[2]}</span>` : '') +
                   (contra ? '<span class="scope s-contra" title="和台账里的说法相反,见本条末尾">与台账相反</span>' : '');
    h += `<details class="lesson" id="${u.id}"><summary>${num ? `<span class="num">${num}</span>` : ''}<span class="lt">${inl(title)}</span>` +
         `<span class="badges">${badges}</span></summary><div class="lbody">${blocks(body)}${quote}${foot.join('')}` +
         `${times ? `<p class="times">讲到的位置 ${inl(times)}</p>` : ''}</div></details>`;
  }
  return h;
}

function rCards(s) {
  let h = '', cards = [];
  const flush = () => { if (cards.length) { h += `<div class="cards">${cards.join('')}</div>`; cards = []; } };
  for (const b of s.blocks) {
    if (b.t !== 'li') { flush(); h += blk(b); continue; }
    const parts = b.md.split(/(?<=[。;;!?!?])\s*(?=\*\*)/).map(x => x.match(/^((?:\*\*[^*]+\*\*[、和与及/\s]*)+)[::]\s*([\s\S]*)$/));
    if (parts.some(x => !x)) { cards.push(`<div class="card wide" id="${b.id}">${inl(b.md)}</div>`); continue; }
    parts.forEach((m, k) => cards.push(`<div class="card"${k ? '' : ` id="${b.id}"`}><div class="name">${inl(m[1].replace(/[、和与及/\s]+$/, ''))}</div><div>${inl(m[2])}</div></div>`));
  }
  flush();
  return h + subsHtml(s);
}

function rTimeline(s) {
  const items = s.blocks.map(b => {
    const m = b.md.match(LABEL);
    if (!m) return `<div class="ti" id="${b.id}"><div class="when"></div><div class="what">${inl(b.md)}</div></div>`;
    const w = m[1].match(/美东\s*([\d:]+)\s*\/\s*北京\s*([\d:]+)\s*(?:[((](?:进度\s*)?([\d:]+)[))])?/);
    const when = w ? `<div class="et"><small>美东</small>${w[1]}</div><div class="bj">北京 ${w[2]}</div>${w[3] ? `<div class="pg">进度 ${w[3]}</div>` : ''}`
                   : `<div class="et2">${inl(m[1])}</div>`;
    return `<div class="ti" id="${b.id}"><div class="when">${when}</div><div class="what">${inl(m[2])}</div></div>`;
  }).join('');
  return `<div class="tl">${items}</div>` + subsHtml(s);
}
/* ---------- 每日总结各节的结构化版式(数据由 build.py 的 enrich 预先拆好) ---------- */
function splitTop(s, seps) {  // 按标点切开,不切「」里面的
  const out = []; let depth = 0, cur = '';
  for (const ch of s) {
    if (ch === '「') depth++; else if (ch === '」') depth = Math.max(0, depth - 1);
    cur += ch;
    if (!depth && seps.includes(ch)) { out.push(cur); cur = ''; }
  }
  if (cur.trim()) out.push(cur);
  return out.map(x => x.trim()).filter(Boolean);
}
function points(text) {  // 一段压缩的话 → 几条要点:按句号切;太长的再按分号切
  const out = [];
  for (const s of splitTop(text, '。')) {
    if (s.length > 46 && /[;;]/.test(s)) splitTop(s, ';;').forEach(x => out.push(x.replace(/[;;]$/, '')));
    else out.push(s);
  }
  return out;
}
const MIS = D.mistakes || {};
const rname = id => (MIS[id] && MIS[id].n) || (RULES[id] && RULES[id].n) || '';
const rchip = id => { const n = rname(id), r = RULES[id] || MIS[id];
  return `<span class="rchip"${r ? ` data-rid="${id}" role="button" tabindex="0"` : ''} title="${esc((r && (r.s || r.n)) || id)}"><b>${id}</b>${n ? esc(n.length > 15 ? n.slice(0, 15) + '…' : n) : ''}</span>`; };

// 「通用(D15、T98)。喊单称……」:编号已经做成上面的理念签,这里只留补充说明;括号里带限定(如「F15 限他觉得稳的标的」)的整句保留
function refNote(md) {
  const m = md.match(/^(?:通用|他本人的?做法|他自己的做法|他自己|给听众的?)\s*[((]([^()()]*)[))]\s*[。;;,,]?\s*([\s\S]*)$/);
  if (!m) return md;
  const qual = m[1].replace(/(?<![A-Za-z0-9])[A-Z]{1,2}\d{1,3}(?!\d)/g, '').replace(/[、,,\s]/g, '');
  return qual ? md : m[2];
}
function rLessons2(s) {
  if (!s.subs.length) return generic(s);
  const cards = [], toc = [];
  for (const u of s.subs) {
    const m = u.title.match(/^(\d+(?:\.\d+)?)\s*(.*?)\s*([((][^()()]*\d{1,2}:\d{2}:\d{2}[^()()]*[))])?\s*$/);
    const num = m ? m[1] : '', title = m ? m[2] : u.title, times = m && m[3] ? m[3] : '';
    const tparts = splitTop(title, ';;').map(x => x.replace(/[;;]$/, ''));
    let quotes = '', pts = [], refs = [], scope = null, contra = false;
    for (const b of u.blocks) {
      const sc = b.t === 'p' && SCOPE.find(x => x[0].test(b.md));
      const refLike = b.t === 'p' && (sc || /^[A-Z]{1,2}\d{1,3}[ 、限]/.test(b.md));
      if (b.t === 'li' && /^「/.test(b.md)) quotes += `<blockquote class="keyq" id="${b.id}">${inl(b.md)}</blockquote>`;
      else if (refLike) { scope = scope || sc || null; if (/相反/.test(b.md)) contra = true; refs.push(b); }
      else if (b.t === 'li') pts.push(b.md);
      else pts.push(...points(b.md));
    }
    if (!scope) { const all = u.blocks.map(b => b.md).join(' '), mm = all.match(/(通用|他本人|他自己|给听众)/); if (mm) scope = SCOPE.find(x => x[0].test(mm[1])); }
    const ids = [...new Set(refs.flatMap(b => b.md.match(/(?<![A-Za-z0-9])[A-Z]{1,2}\d{1,3}(?!\d)/g) || []))];
    const left = refs.map(b => b.md).join(' ').replace(/(?<![A-Za-z0-9])[A-Z]{1,2}\d{1,3}(?!\d)/g, '')
      .replace(/通用|他本人的?做法|他自己的做法|他自己|给听众的?|[((][^()()]*[))]|[、,,;;。:: ]/g, '');
    const sc = scope ? scope[1] : 'none';
    const badges = (scope ? `<span class="scope s-${sc}">${scope[2]}</span>` : '') +
                   (contra ? '<span class="scope s-contra" title="和台账里的说法相反,见「台账说明」">与台账相反</span>' : '');
    toc.push(`<li><a href="#${u.id}" data-jump="${u.id}"><i class="dot d-${sc}${contra ? ' d-contra' : ''}"></i><span class="tn">${num}</span>${inl(tparts[0] || title)}</a></li>`);
    cards.push(`<article class="lcard l-${sc}" id="${u.id}"><header><span class="num">${num}</span><h3>${inl(tparts[0] || title)}</h3><span class="badges">${badges}</span></header>` +
      (tparts.length > 1 ? `<p class="lsub">${tparts.slice(1).map(inl).join('<span class="sep">·</span>')}</p>` : '') +
      `<div class="lb">${quotes}${pts.length ? `<ul class="pts">${pts.map(x => `<li>${inl(x)}</li>`).join('')}</ul>` : ''}` +
      (ids.length ? `<div class="lrules"><span class="lbl">对应理念</span>${ids.map(rchip).join('')}</div>` : '') +
      (left.length ? `<p class="lnote"><span class="lbl">台账说明</span>${refs.map(b => inl(refNote(b.md))).join(' ')}</p>` : '') +
      (times ? `<p class="times">讲到的位置 ${inl(times)}</p>` : '') + '</div></article>');
  }
  return blocks(s.blocks) +
    `<div class="ltop"><ol class="ltoc">${toc.join('')}</ol><div class="ltools"><button type="button" class="iconbtn" data-act="lessons">只看标题</button></div></div>` +
    `<div class="lcards">${cards.join('')}</div>`;
}

const tkLink = (name, keys) => keys && keys.length && TBY.has(keys[0]) ? `<a class="tlink" href="#/t/${encodeURIComponent(keys[0])}" title="看${esc(TBY.get(keys[0]).name)}的档案">${inl(name)}</a>` : inl(name);
const STC2 = {'看多': 'll', '偏多': 'l', '观望': 'z', '没表态': 'z', '偏空': 's', '看空': 'ss', '不碰': 'n'};
const erow = (e, id) => `<div class="erow"${id ? ` id="${id}"` : ''}><div class="en">${tkLink(e.name, e.keys)}</div>` +
  `<div class="et">${e.stance ? `<span class="stc c-${STC2[e.stance] || 'n'}">${esc(e.stance)}</span>` : ''}${inl(e.md)}</div></div>`;
function rEnts(s) {
  // 一行一个标的(新写法)的连续几行合进同一个框;一行塞了几个标的(旧写法)的各自成框;**板块名** 单独一行是分组标题
  let h = '', grp = [], aud = false;
  const flush = () => { if (grp.length) { h += `<div class="egroup${aud ? ' muted' : ''}">${grp.join('')}</div>`; grp = []; } };
  const run = list => {
    for (const b of list) {
      if (b.t === 'li' && b.ents && b.ents.length === 1) { grp.push(erow(b.ents[0], b.id)); continue; }
      flush();
      if (b.t === 'p') {
        const m = b.md.match(/^\*\*([^*]+)\*\*[::]?$/);
        if (m) aud = /给听众|不计/.test(m[1]);
        h += m ? `<h4 class="egrp${aud ? ' muted' : ''}" id="${b.id}">${inl(m[1])}</h4>` : `<p id="${b.id}">${inl(b.md)}</p>`;
      } else if (!b.ents) h += `<div class="erow wide${aud ? ' muted' : ''}" id="${b.id}"><div class="et">${inl(b.md)}</div></div>`;
      else h += `<div class="egroup${aud ? ' muted' : ''}" id="${b.id}">${b.ents.map(e => erow(e)).join('')}</div>`;
    }
    flush();
  };
  run(s.blocks);
  for (const u of s.subs) { h += `<h3 id="${u.id}">${inl(u.title)}</h3>`; aud = /给听众|不计/.test(u.title); run(u.blocks); }
  return `<div class="ents">${h}</div>`;
}

function rChg(s) {
  const cards = s.blocks.map(b => {
    const c = b.chg;
    if (!c) return b.t === 'li' ? `<div class="chg plain" id="${b.id}">${inl(b.md)}</div>` : blk(b);
    const head = `<div class="ch-h">${tkLink(`**${c.topic}**`, c.keys)}${c.tag ? `<span class="ctag">${esc(c.tag)}</span>` : ''}</div>`;
    if (c.same !== undefined) return `<div class="chg same" id="${b.id}">${head}<div class="ch-one">${inl(c.same)}</div></div>`;
    const when = c.when ? c.when.split('-').map(Number).join('/') : '';
    return `<div class="chg" id="${b.id}">${head}<div class="ch-b"><div class="ch-x"><span class="lbl">之前${when ? ' · ' + when : ''}</span>${inl(c.before)}</div>` +
      `<div class="ch-ar" aria-hidden="true">→</div><div class="ch-x now"><span class="lbl">今天</span>${inl(c.after)}</div></div></div>`;

function rMis(s) {

}

function observe() {
  if (IO) IO.disconnect();

  const vis = new Set();
  IO = new IntersectionObserver(es => {
    es.forEach(e => e.isIntersecting ? vis.add(e.target.id) : vis.delete(e.target.id));
    const top = $$('.sec', view).find(s => vis.has(s.id));
    if (!top) return;
    chips.forEach(c => c.classList.toggle('on', c.dataset.s === top.id));
    const on = chips.find(c => c.dataset.s === top.id);
    if (on) nav.scrollLeft = on.offsetLeft - nav.clientWidth / 3;

const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const terms = q => q.trim().split(/\s+/).filter(Boolean);
function markAll(root, q) {
  const ts = terms(q);
  if (!ts.length) return;
  const rx = new RegExp(ts.map(reEsc).join('|'), 'gi'), test = new RegExp(rx.source, 'i');
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes) {
    const t = n.nodeValue;
    if (!test.test(t)) continue;
    const f = document.createDocumentFragment();
    let last = 0;
    t.replace(rx, (m, off) => { f.append(t.slice(last, off)); const k = document.createElement('mark'); k.textContent = m; f.append(k); last = off + m.length; return m; });
    f.append(t.slice(last));
    n.replaceWith(f);
  }
  $$('mark', root).forEach(m => { const d = m.closest('details'); if (d) d.open = true; });
}
function snippet(txt, ts) {
  const low = txt.toLowerCase(), at = Math.max(0, low.indexOf(ts[0].toLowerCase()));
  const a = Math.max(0, at - 50), b = Math.min(txt.length, at + 90);
  let s = esc((a ? '…' : '') + txt.slice(a, b) + (b < txt.length ? '…' : ''));
  return s.replace(new RegExp(ts.map(t => reEsc(esc(t))).join('|'), 'gi'), m => `<mark>${m}</mark>`);
}
function renderSearch(q) {
  const ts = terms(q), lows = ts.map(t => t.toLowerCase());
  let total = 0, html = '';
  const collect = secs => {
    const hits = [];
    for (const s of secs) {
      const all = s.blocks.map(b => [b, s.short]).concat(...s.subs.map(u => [[{id: u.id, md: u.title}, s.short], ...u.blocks.map(b => [b, s.short + ' · ' + u.title.replace(/[((].*$/, '')])]));
      for (const [b, where] of all) {
        const txt = b.md.replace(/\*\*/g, '').replace(/\[\[[^\]]*\]\]/g, ''), low = txt.toLowerCase();
        if (lows.every(t => low.includes(t))) hits.push({b, where, txt});
      }
    }
    return hits;
  };
  const group = (head, href, hits, more) => {
    total += hits.length;
    return `<div class="hitday">${head}<span>${hits.length} 处</span></div>` + hits.slice(0, 30).map(h =>
      `<a class="hit" href="${href}" data-b="${h.b.id}"><span class="where">${esc(h.where)}</span>${snippet(h.txt, ts)}</a>`).join('') +
      (hits.length > 30 ? `<p class="refs">还有 ${hits.length - 30} 处,${more}看全部。</p>` : '');
  };
  for (const e of ESSAYS) {
    const hits = collect(e.sections);
    if (hits.length) html += group(`心路历程 · ${esc(e.title.replace(/\*\*/g, ''))}`, `#/essays/${e.slug}`, hits, '打开这篇');
  }
  for (const d of DAYS) {
    const hits = collect(d.sections);
    if (hits.length) html += group(`${md(d.date)} ${d.wd}`, `#/${d.date}`, hits, '打开这一场');
  }
  view.innerHTML = `<article><div class="dayhead"><h1>搜索 <span class="q">「${esc(q)}」</span></h1><p class="meta">` +
    `${total ? `${total} 处 · 点一条跳到那一场,关键词会高亮` : '没有找到。可以换个说法,或者用空格分开多个词(同时包含)。'}</p></div>${html}</article>`;
  sideActive(null);
  window.scrollTo(0, 0);
}

function route() {
  hidePop();
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')), parts = h.split('/');
  if (parts[0] === 'essays') {
    setTab('essays');
    renderSide('essays');
    const e = BYSLUG.get(parts[1]), sec = parts[2];
    if (!e) { RENDERED = {v: 'essays'}; renderEssays(); return; }
    if (RENDERED.v === 'essay' && RENDERED.slug === e.slug && !HL) {
      if (sec && document.getElementById(sec)) document.getElementById(sec).scrollIntoView();
      return;
    }
    RENDERED = {v: 'essay', slug: e.slug};
    renderEssay(e, sec);
    return;
  }
  if (parts[0] === 't') {
    setTab('tickers');
    renderSide('tickers');
    const t = TBY.get(parts[1]) || TICKERS.find(x => x.name.split(/\s|·/).includes(parts[1]));  // #/t/英伟达 也能打开
    RENDERED = {v: t ? 'ticker' : 'tickers'};
    t ? renderTicker(t) : renderTickers();
    return;
  }
  renderSide('days');
  if (parts[0] === 'presets') { setTab('presets'); RENDERED = {v: 'presets'}; renderPresets(parts[1]); return; }
  setTab('days');
  if (parts[0] === 'q') {
    const q = parts.slice(1).join('/');
    if ($('#q').value !== q) $('#q').value = q;
    RENDERED = {v: 'q'};
    q.trim() ? renderSearch(q) : renderDay(BYDATE.get(LASTDAY) || DAYS[0]);
    return;
  }
  const day = BYDATE.get(parts[0]) || DAYS[0], sec = parts[1];
  if (RENDERED.v === 'day' && RENDERED.date === day.date && !HL) {
    if (sec && document.getElementById(sec)) document.getElementById(sec).scrollIntoView();
    return;
  }
  RENDERED = {v: 'day', date: day.date};
  LASTDAY = day.date;
  renderDay(day, sec);
}
