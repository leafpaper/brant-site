# 每次推送到 main:用 content/ 里的数据生成网页,发布到 GitHub Pages(https://leafpaper.github.io/brant-site/)
# 注意:网页没有密码,拿到链接的人都能看;页面带 noindex + robots.txt,不让搜索引擎收录。
name: 发布网页
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成网页(没有 brant-lens 时自动用 content/daily.json)
        run: python build.py
      - name: 不让搜索引擎收录
        run: printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
